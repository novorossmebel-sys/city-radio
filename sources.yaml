    - "telegram:min2ru"
    - "telegram:blog_andychef"
    - "telegram:foodrumedia"
    - "telegram:tveda"
    - "telegram:thesaltmagazine"
    - "telegram:foodandscience"
    - "telegram:foodiscovery"
    - "telegram:culinary_abuse"
  rotate: true
  cadence: "раз в сутки, ориентир 10:00-11:00"
  moderation: true

kino_serialy:
  title: "Кино и сериалы"
  source_type: mixed
  source:  # ротация: новый пост = новый источник
    - "kinopoisk.ru"
    - "imdb.com"
    - "telegram:polkasserialami"
    - "telegram:kinopoisk"
    - "telegram:kinopoisk_soon"
    - "telegram:kinotvnews"
    - "telegram:remizorro"
    - "telegram:MaxAndSe"
    - "telegram:seance_light"
    - "telegram:Cronenberg1664"
    - "telegram:FBChu"
    - "telegram:KingOfYantar"
    - "telegram:filmres"
    - "telegram:movies_filmy"
  rotate: true
  cadence: "по пятницам"
  filter: "топ-5, рейтинг >7, новинки Netflix/Amazon/HBO/прокат"
  moderation: true

puteshestviya:
  title: "Путешествия"
  source_type: manual  # генерация фактов/историй, не агрегация
  source: null
  cadence: "по средам"
  moderation: true

