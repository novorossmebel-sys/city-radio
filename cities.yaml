# Список городов. Добавление нового города = ещё один блок здесь.
# Движок city-agnostic: код общий, различаются только данные городов.

novorossiysk:
  title: "Новороссийск"
  timezone: "Europe/Moscow"
  # Канал Telegram: @username или числовой id вида -100xxxxxxxxxx.
  # Бот должен быть добавлен админом канала с правом публикации.
  # ВАЖНО: сейчас это id приватной ГРУППЫ (не канала-трансляции), -5340268164 —
  # для продакшена стоит перейти на настоящий канал (см. обсуждение 2026-08-15).
  telegram_channel: "-5340268164"
  # Канал MAX: chat_id канала (бот — админ канала). Токен бота — у @MasterBot.
  # ВАЖНО: "id231536618490_biz" (из ссылки канала) — это НЕ chat_id, только публичный
  # слаг; настоящий числовой chat_id узнан через GET /chats под токеном бота
  # (2026-08-25) — публикация по слагу давала 400 proto.payload, по слагу без "id"/"biz"
  # давала 404 chat.not.found.
  max_channel: "-77492823908995"
